version: "2"
# One block per domain, each generating into its own internal tree.
# A domain block: `- <<: *block`, its own `queries`, and `gen: {go: {<<: *go, out: internal/<domain>/internal/db}}`.
sql:
  - &block
    name: postgres
    engine: postgresql
    schema: ../database/migrations
    queries: sqlc/queries/postgres.sql
    gen:
      go: &go
        package: db
        out: internal/postgres/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
