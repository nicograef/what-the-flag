version: "2"

# ── Run ──────────────────────────────────────────────────────────────────────
# Integration test files carry `//go:build integration`; without the tag they go unlinted.
run:
  build-tags:
    - integration

# ── Linters ──────────────────────────────────────────────────────────────────
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - nolintlint
    - forbidigo
    - exhaustive
    - depguard
  exclusions:
    rules:
      # Contract tests hand each response to decode or expectError, which close it;
      # bodyclose does not follow a response into the function it is passed to.
      - path: internal/contract/
        linters:
          - bodyclose
  settings:
    depguard:
      rules:
        # A domain core imports neither HTTP nor database code; its adapters live in subpackages.
        domain-core:
          files:
            - "**/internal/quiz/*.go"
            - "**/internal/country/*.go"
          deny:
            - pkg: net/http
              desc: a domain core is pure; HTTP belongs in its httpapi adapter
            - pkg: github.com/jackc/pgx
              desc: a domain core is pure; Postgres belongs in its postgres adapter
            - pkg: github.com/nicograef/what-the-flag/internal/httpx
              desc: a domain core is pure; HTTP belongs in its httpapi adapter
            - pkg: github.com/nicograef/what-the-flag/internal/postgres
              desc: a domain core is pure; Postgres belongs in its postgres adapter
            - pkg: github.com/nicograef/what-the-flag/internal/quiz/postgres
              desc: the core defines ports; the adapter depends on the core, not the reverse
            - pkg: github.com/nicograef/what-the-flag/internal/quiz/httpapi
              desc: the core defines ports; the adapter depends on the core, not the reverse
    gosec:
      excludes:
        - G115 # integer-conversion overflow: false positives on bounded casts
    exhaustive:
      # A default branch does not excuse a missing case.
      default-signifies-exhaustive: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam # passing structs by value is a readability choice, not a bug
        - rangeValCopy

# ── Formatters ───────────────────────────────────────────────────────────────
# goimports, not gofumpt: gopls formats with goimports rules on save, so editor and CI agree.
formatters:
  enable:
    - goimports

output:
  sort-order:
    - file
