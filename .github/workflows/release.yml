# A vX.Y.Z tag (`make prod-release VERSION=X.Y.Z`) builds the app images and pushes them to
# GHCR under that tag; docker-compose.prod.yml pins the same tag. The tag goes on a main commit
# CI already checked, so this workflow runs no tests.
#
# Every `uses:` is pinned to a full commit SHA, with its release in the trailing comment (see ci.yml).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Releases queue instead of cancelling a half-pushed set of images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # One entry per app image in docker-compose.prod.yml, with its build context and Dockerfile.
        # The edge image reads frontend/ and reverse-proxy/, so it builds from the repo root.
        # The backend image reads NOTICE through the named context `root`, as docker-compose.yml passes it.
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
            build-contexts: root=.
          - service: edge
            context: .
            file: ./reverse-proxy/Dockerfile
          - service: migrate
            context: ./database
            file: ./database/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ghcr.io/nicograef/what-the-flag-${{ matrix.service }}:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
