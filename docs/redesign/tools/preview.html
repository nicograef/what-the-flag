<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What The Flag redesign: prototypes</title>
<style>
  body { margin: 0; background: #0B0C1A; color: #E7E8F7; font: 15px/1.45 system-ui, sans-serif; }
  #page { display: flex; gap: 32px; align-items: flex-start; padding: 24px; width: max-content; }
  #stage { position: relative; flex-shrink: 0; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px #2A2E5E; }
  #marks { position: absolute; inset: 0; pointer-events: none; }
  .mark-box { position: absolute; border: 2px solid #FF4FD8; border-radius: 6px; }
  .mark-num { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #FF4FD8; color: #1A0016;
    font: 800 14px/26px system-ui, sans-serif; text-align: center; box-shadow: 0 0 0 2px #0B0C1A; }
  #notes { width: 420px; display: none; }
  #notes h1 { margin: 0 0 4px; font-size: 22px; color: #FFFFFF; }
  #notes .id { margin: 0 0 12px; font: 13px ui-monospace, monospace; color: #8E93C4; }
  #notes .summary { margin: 0 0 16px; color: #C9CCEA; }
  #notes ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  #notes li { display: flex; gap: 10px; }
  #notes li b { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #FF4FD8; color: #1A0016;
    font: 800 14px/26px system-ui, sans-serif; text-align: center; }
  #index { padding: 32px; max-width: 760px; }
  #index a { color: #FFC93C; }
</style>
<script src="runtime.js"></script>
</head>
<body>
<div id="page">
  <div id="stage"><div id="root"></div><div id="marks"></div></div>
  <aside id="notes"></aside>
</div>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const board = params.get("board");
  const annotations = await (await fetch("annotations.json")).json();

  if (!board) {
    document.getElementById("page").outerHTML = '<div id="index"></div>';
    const index = document.getElementById("index");
    const link = (id, label) => `<li><a href="?board=${id}">${label}</a></li>`;
    index.innerHTML = "<h1>What The Flag redesign</h1><h2>A+ Final</h2><ol>" +
      Object.entries(annotations.screens).map(([id, a]) => link(id, a.title)).join("") +
      "</ol><h2>Explorations</h2><ul>" +
      annotations.explorations.map((id) => link("explorations/" + id, id)).join("") + "</ul>";
    return;
  }

  const meta = annotations.screens[board] || { w: 390, h: 844, notes: [] };
  const stage = document.getElementById("stage");
  stage.style.width = meta.w + "px";
  stage.style.height = meta.h + "px";
  const source = await (await fetch("../prototypes/" + board + ".dc.html")).text();
  window.renderDC(source, document.getElementById("root"));

  // Links between prototypes stay inside the preview.
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");
    if (href.endsWith(".dc.html")) {
      e.preventDefault();
      const dir = board.includes("/") ? board.slice(0, board.lastIndexOf("/") + 1) : "";
      location.search = "?board=" + dir + href.replace(/\.dc\.html$/, "") + (params.has("annotate") ? "&annotate=1" : "");
    } else if (href === "#") {
      e.preventDefault();
    }
  });

  if (!params.has("annotate") || !meta.notes) return;
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, Number(params.get("settle") || 700)));

  const notes = document.getElementById("notes");
  notes.style.display = "block";
  notes.innerHTML = `<h1>${meta.title}</h1><p class="id">prototypes/${board}.dc.html</p>` +
    `<p class="summary">${meta.summary}</p><ol>` +
    meta.notes.map((n, i) => `<li><b>${i + 1}</b><span>${n.text}</span></li>`).join("") + "</ol>";

  const marks = document.getElementById("marks");
  const base = stage.getBoundingClientRect();
  function find(at) {
    if (at.startsWith("sel:")) return stage.querySelector(at.slice(4));
    const needle = at.slice(5);
    let best = null;
    for (const el of document.getElementById("root").querySelectorAll("*")) {
      const t = el.textContent || el.getAttribute("aria-label") || "";
      const hit = t.includes(needle) || (el.getAttribute("aria-label") || "").includes(needle);
      if (hit && (!best || t.length <= (best.textContent || "").length)) best = el;
    }
    return best;
  }
  meta.notes.forEach((n, i) => {
    const el = n.at && find(n.at);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const box = document.createElement("div");
    box.className = "mark-box";
    Object.assign(box.style, { left: r.left - base.left - 3 + "px", top: r.top - base.top - 3 + "px", width: r.width + 2 + "px", height: r.height + 2 + "px" });
    const num = document.createElement("div");
    num.className = "mark-num";
    num.textContent = i + 1;
    const nx = Math.min(Math.max(r.right - base.left - 14, 2), meta.w - 28);
    const ny = Math.min(Math.max(r.top - base.top - 14, 2), meta.h - 28);
    Object.assign(num.style, { left: nx + "px", top: ny + "px" });
    marks.append(box, num);
  });
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
