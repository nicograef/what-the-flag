<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ranglisten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
.tab{flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:#A9ADD6;font:700 16px 'Baloo 2',sans-serif;cursor:pointer}
.tab.on{background:#2A2E5E;color:#F5F6FF}
.tab:focus-visible{outline:3px solid #FFC93C;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12142B; color: #F5F6FF; font-family: 'Baloo 2', system-ui, sans-serif; display: flex; flex-direction: column; padding: 8px 16px 0; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px">
    <a href="F-Home.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5F6FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">Rangliste</h1>
  </header>

  <div role="tablist" aria-label="Rangliste wählen" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #1E2147">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button type="button" role="tab" aria-selected="{{t.sel}}" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
    </sc-for>
  </div>
  <p style="margin: 8px 0 0; font-size: 14px; color: #A9ADD6; text-align: center">{{sub}}</p>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; margin-top: 10px">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 16px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span>
        <div style="width: 100%; height: {{p.h}}px; border-radius: 14px 14px 0 0; background: {{p.bg}}; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 30px; font-weight: 800; line-height: 1">{{p.score}}</span>
          <span style="font-size: 14px; font-weight: 700">Platz {{p.rank}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <ol style="list-style: none; margin: 0; padding: 6px 0 0; display: flex; flex-direction: column; border-top: 2px solid #2A2E5E; flex: 1; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <li aria-current="{{r.cur}}" style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 10px; margin: 0 -10px; border-radius: 12px; background: {{r.bg}}; font-size: 18px">
        <span style="width: 32px; text-align: center; color: #A9ADD6; font-weight: 700">{{r.rank}}</span>
        <span style="flex: 1; font-weight: 600">{{r.name}}</span>
        <strong>{{r.score}}</strong>
      </li>
    </sc-for>
  </ol>

  <sc-if value="{{showOwn}}" hint-placeholder-val="{{ true }}">
    <div aria-current="true" style="margin: 0 -16px; padding: 14px 16px 24px; background: #1E2147; border-top: 2px solid #FFC93C; display: flex; align-items: center; gap: 14px; font-size: 18px">
      <span style="width: 32px; text-align: center; font-weight: 800; color: #FFC93C">{{own.rank}}</span>
      <span style="flex: 1; font-weight: 700">Nico <span style="font-size: 14px; color: #A9ADD6">(du)</span></span>
      <strong>{{own.score}}</strong>
      <a href="F-Question.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 14px; background: #FFC93C; color: #2A1B00; font-weight: 800; text-decoration: none">{{own.cta}}</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'world' }; }
  renderVals() {
    const D = {
      world: { label: 'Weltweit', sub: 'Alle eigenen Spiele, aller Zeiten', list: [[1,'globetrotter',87],[2,'Aylin',74],[3,'Pjotr',69],[4,'marta.k',61],[5,'Felix',58],[5,'Sofía',58],[7,'kartenkind',55],[8,'Ben',52]], own: { rank: 96, score: 27, cta: 'Spielen' } },
      daily: { label: 'Heute', sub: 'Tagesquiz vom 28. November', list: [[1,'Aylin',41],[2,'Q.',36],[3,'Hana',33],[4,'Felix',29],[5,'Nico',27,true],[6,'Ben',21],[7,'Tarek',18],[8,'Ute',12]], own: null },
      quiz: { label: 'Nicos Quiz', sub: 'Deine letzte Herausforderung, 4 Spieler', list: [[1,'Kim',31],[2,'Nico',27,true],[3,'Jonas',19],[4,'Mo',12]], own: null }
    };
    const cur = D[this.state.tab];
    const top = cur.list.slice(0, 3);
    const podium = [top[1], top[0], top[2]].map((r, i) => ({
      rank: r[0], name: r[1] + (r[3] ? ' (du)' : ''), score: r[2],
      h: [92, 128, 72][i],
      bg: ['#CBD5E1', '#FFD54A', '#F0A36B'][i],
      fg: ['#1E293B', '#3A2A00', '#3B1A05'][i]
    }));
    return {
      tabs: Object.keys(D).map((k) => ({
        label: D[k].label, sel: k === this.state.tab ? 'true' : 'false',
        cls: k === this.state.tab ? 'tab on' : 'tab',
        pick: () => this.setState({ tab: k })
      })),
      sub: cur.sub,
      podium,
      rows: cur.list.slice(3).map((r) => ({
        rank: r[0], name: r[1] + (r[3] ? ' (du)' : ''), score: r[2],
        cur: r[3] ? 'true' : 'false', bg: r[3] ? '#2A2E5E' : 'transparent'
      })),
      showOwn: !!cur.own,
      own: cur.own || { rank: '', score: '', cta: '' }
    };
  }
}
</script>
</body>
</html>
