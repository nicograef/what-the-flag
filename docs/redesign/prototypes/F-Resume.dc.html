  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <div style="display: flex; flex-direction: column; gap: 4px; width: 180px">
      <span style="font-size: 14px; font-weight: 700; color: #A9ADD6">Level 3 · Sprachen</span>
      <div aria-hidden="true" style="display: flex; gap: 4px">
        <div style="flex: 1; height: 8px; border-radius: 4px; background: #FFC93C"></div>
        <div style="flex: 1; height: 8px; border-radius: 4px; background: #FFC93C; opacity: .45"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
    <div role="progressbar" aria-label="Verbleibende Zeit" aria-valuemin="0" aria-valuemax="15" aria-valuenow="4" style="flex: 1; height: 12px; border-radius: 6px; background: #1E2147; overflow: hidden"><div style="height: 100%; width: 26%; background: #FF9F43; border-radius: 6px"></div></div>

  </div>

  <div role="status" style="margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #1E2147; border: 2px solid #FF9F43">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9F43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
    <span style="font-size: 16px; line-height: 1.3">Willkommen zurück. Die Uhr lief weiter: noch 4 Sekunden.</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
    <h1 style="margin: 0; font-size: 21px; font-weight: 700">Was ist die Hauptstadt dieses Landes?</h1>
    <p style="margin: 0; font-size: 46px; font-weight: 800; line-height: 1; color: #FFC93C">Kanada</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <button type="button" class="o">Washington</button>
    <button type="button" class="o">Mexiko-Stadt</button>
    <button type="button" class="o">Ottawa</button>
    <button type="button" class="o">Havanna</button>

  <p style="margin: 10px 0 0; text-align: center; font-size: 14px; font-weight: 600; color: #A9ADD6">Antwort kurz gedrückt halten</p>
